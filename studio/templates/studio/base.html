<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SRAI Studio</title>
  <style>
    :root{--ink:#17243d;--blue:#175cd3;--pale:#eef4ff;--line:#d7dfeb;--gold:#b7791f}
    *{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:var(--ink);font:15px/1.5 system-ui,sans-serif}
    header{background:#102a56;color:white;padding:16px 5%;display:flex;gap:24px;align-items:center}header strong{font-size:20px}
    nav{display:flex;gap:14px;flex-wrap:wrap}nav a{color:white;text-decoration:none}main{max-width:1180px;margin:28px auto;padding:0 20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
    .metric{font-size:30px;font-weight:750}.muted{color:#667085}.narrow{max-width:430px;margin:50px auto}table{width:100%;border-collapse:collapse;background:white}
    th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:var(--pale)}a{color:var(--blue)}
    .badge{display:inline-block;padding:3px 8px;border-radius:20px;background:var(--pale)}.gold{color:var(--gold);font-weight:700}
    button{background:var(--blue);color:white;border:0;border-radius:7px;padding:9px 15px}.error{color:#b42318}
  </style>
</head>
<body>
<header><strong>SRAI Studio</strong>
{% if user.is_authenticated %}
<nav><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'curriculum' %}">Curriculum</a>
<a href="{% url 'production_units' %}">Production Units</a><a href="{% url 'work_queue' %}">Work Queue</a>
<a href="{% url 'release_readiness' %}">Releases</a><a href="/admin/">Admin</a>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form></nav>
{% endif %}</header>
<main>{% block content %}{% endblock %}</main>
</body></html>
