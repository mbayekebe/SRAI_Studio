services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srai_studio}
      POSTGRES_USER: ${POSTGRES_USER:-srai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-srai}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_pilot &&
             python manage.py import_srai_catalog &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
